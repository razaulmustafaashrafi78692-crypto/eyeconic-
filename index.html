<style>
:root{--bg:#0b0b0d;--tx:#f3efe7;--mu:#8f8b84;--ac:#d4af6a;--ac2:#f0d9a0;--bd:#25252a;--in:#17171b;--cd:#131316;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.w{max-width:470px;margin:0 auto}
.logo{font:400 40px/1.2 "Snell Roundhand","Segoe Script","Brush Script MT",cursive;text-align:center;margin:28px 0 14px}
.pad{padding:14px}
.s{color:var(--mu);font-size:14px;margin-bottom:12px;text-align:center}
input,textarea{width:100%;box-sizing:border-box;border:1px solid var(--bd);border-radius:6px;padding:10px;background:var(--in);color:var(--tx);font:inherit}
textarea{min-height:70px;resize:vertical}
.r{display:flex;gap:8px;align-items:center}.r span{color:var(--mu)}
button{width:100%;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
button:disabled{opacity:.4}
button.g{background:none;color:var(--ac);width:auto;padding:4px 6px;margin:0}
.d{background:var(--in);border:1px solid var(--bd);border-radius:6px;padding:8px;font-size:13px;margin-top:10px}
.e{color:#ed4956;font-size:13px;margin-top:6px;min-height:16px}
.st{display:flex;gap:14px;overflow-x:auto;padding:12px 14px;border-bottom:1px solid var(--bd);scrollbar-width:none}
.st::-webkit-scrollbar{display:none}
.sc{flex:none;width:72px;text-align:center;font-size:12px;cursor:default}
.sc .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.ring{width:68px;height:68px;border-radius:50%;padding:3px;box-sizing:border-box;background:linear-gradient(45deg,#f9a825,#e6683c,#dc2743,#cc2366,#bc1888);position:relative;margin:0 auto}
.ring.me{background:var(--bd)}
.ring i{display:flex;width:100%;height:100%;border-radius:50%;background:var(--in);border:3px solid var(--bg);box-sizing:border-box;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:18px}
.plus{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:#fff;color:#000;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);box-sizing:border-box;line-height:1}
.post{margin-bottom:6px}
.hd{display:flex;gap:10px;align-items:center;padding:10px 12px}
.hd .ring{width:38px;height:38px;padding:2px;margin:0}.hd .ring i{font-size:13px;border-width:2px}
.hd .nm{font-weight:600;line-height:1.2}.hd .sub{color:var(--mu);font-size:12px}
.hd .dots{margin-left:auto;font-size:20px;color:var(--mu)}
.media{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;font-weight:800;font-size:26px;line-height:1.25;color:#fff;white-space:pre-wrap;word-break:break-word;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.act{padding:10px 12px 2px;display:flex}
.lk{background:none;color:var(--tx);font-size:26px;padding:0;line-height:1;width:auto;margin:0}
.lk.on{color:#ed4956}
.cap{padding:2px 12px 14px}
.cap b{margin-right:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);display:flex;justify-content:space-around;align-items:center;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.tabs svg{width:28px;height:28px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tabs .pf{width:30px;height:30px;border-radius:50%;background:linear-gradient(45deg,#f9a825,#dc2743,#bc1888);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;cursor:pointer}
.tabs>*{cursor:pointer}
.opt{background:var(--in);color:var(--tx);border:2px solid var(--bd);text-align:left;font-size:16px;padding:11px 14px;margin-top:6px}
.opt small{color:var(--mu);font-size:13px;margin-left:8px;font-weight:400}
.opt.on{border-color:var(--ac)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.top .wm{font:700 24px/1 Georgia,"Noto Serif Devanagari",serif;letter-spacing:.5px;color:var(--ac)}
.top .wm small{display:block;font:400 11px/1.3 -apple-system,"Segoe UI",sans-serif;color:var(--mu);letter-spacing:0;margin-top:3px}
.who{display:flex;gap:12px;overflow-x:auto;padding:14px;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none;font-size:16px}
.av.sm{width:38px;height:38px;font-size:14px}
.wp{flex:none;text-align:center;font-size:11px;color:var(--mu);width:56px}
.wp .av{margin:0 auto 4px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac)}
.cmp{margin:0 14px 12px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px}
.cmp textarea{background:transparent;border:0;padding:4px;min-height:64px;font-size:16px}
.cmp textarea:focus{outline:none}
.cmp .row{display:flex;justify-content:space-between;align-items:center}
.cmp .cnt{color:var(--mu);font-size:12px}
.cmp button{width:auto;margin:0;border-radius:999px;padding:8px 20px}
.card{margin:0 14px 12px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.card .hd2{display:flex;gap:10px;align-items:center;padding:12px 12px 6px}
.card .nm2{font-weight:600;line-height:1.2}.card .sb2{color:var(--mu);font-size:12px}
.card .me2{margin-left:auto;font-size:11px;color:var(--ac);border:1px solid var(--ac);border-radius:999px;padding:1px 8px}
.card .bd2{padding:6px 14px 12px;font:19px/1.5 Georgia,"Noto Serif Devanagari",serif;white-space:pre-wrap;word-break:break-word}
.card .ft2{display:flex;align-items:center;gap:8px;padding:0 10px 10px}
.card .lk2{width:auto;margin:0;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-weight:500}
.card .lk2.on{color:#ed4956;border-color:#ed4956}
.card .strip{height:5px}
.top{flex-wrap:wrap;gap:8px}
.top input{flex:1 1 100%;border-radius:999px;padding:9px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;width:auto;margin:0;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;font-weight:500}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.ban{margin:12px 14px;border-radius:16px;padding:18px;color:#fff;background:linear-gradient(120deg,#e0653a,#b8326a);font-weight:700;font-size:20px;line-height:1.25}
.ban small{display:block;font-weight:400;font-size:13px;opacity:.9;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 12px}
.pc{background:var(--cd);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.art{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.art svg{width:86%;height:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.hb{position:absolute;top:6px;right:6px;width:32px;height:32px;margin:0;padding:0;border-radius:50%;background:rgba(255,255,255,.85);color:#555;font-size:18px;line-height:32px}
.hb.on{color:#ed4956}
.pi{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.pn{font-weight:600;font-size:14px;line-height:1.25}
.pr{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.pr b{font-size:16px}.pr s{color:var(--mu);font-size:12px}.pr em{color:#2e9e5b;font-size:12px;font-style:normal;font-weight:600}
.rt{color:var(--mu);font-size:12px}
.sb{width:auto;margin:6px 0 0;padding:7px 12px;font-size:13px;border-radius:8px}
.sb.o{background:none;color:var(--ac);border:1px solid var(--ac)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:470px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding-bottom:20px}
.sh .art{border-radius:20px 20px 0 0;cursor:default}
.sh .in{padding:14px}
.sh h2{margin:0 0 6px;font-size:20px}
.sh p{color:var(--mu);margin:8px 0}
.xb{position:absolute;top:10px;left:10px;width:34px;height:34px;margin:0;padding:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:16px}
.ci{display:flex;gap:10px;align-items:center;margin:0 14px 10px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:8px}
.ci .art{width:72px;aspect-ratio:1/1;border-radius:10px;flex:none}
.ci .pi{padding:0}
.qt{display:flex;align-items:center;gap:10px;margin-top:4px}
.qt button{width:28px;height:28px;margin:0;padding:0;border-radius:50%;background:var(--in);color:var(--tx);border:1px solid var(--bd)}
.sm2{margin:14px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px}
.sm2 div.l{display:flex;justify-content:space-between;margin:4px 0}
.sm2 div.t{font-weight:700;font-size:17px;border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}
.sm2 input{margin-top:8px}
.tb{position:relative;cursor:pointer}
.tb.on svg{stroke:var(--ac)}
.tb b{position:absolute;top:-6px;right:-10px;background:var(--ac);color:#fff;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:30}
.ok{margin:24px 14px;text-align:center;background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:24px}
.ok .big{font-size:48px}

gu:"મોબાઇલ નંબરથી લોગિન કરો (ડેમો)|૧૦ અંકનો મોબાઇલ નંબર|OTP મોકલો|સાચો ૧૦ અંકનો મોબાઇલ નંબર નાખો (૬-૯ થી શરૂ).|{p} પર OTP મોકલ્યો.|ડેમો: સાચો SMS જતો નથી. તમારો OTP છે {c}|૬ અંકનો OTP|ચકાસો|ફરી મોકલો|નંબર બદલો|OTP ખોટો છે. {n} પ્રયાસ બાકી.|૩ વાર ખોટો. નવો OTP મંગાવો.|લોગઆઉટ કરવું છે?|તમારી સ્ટોરી|કંઈક લખો...|શેર કરો|હજી કોઈ પોસ્ટ નથી. ઉપર તમારી સ્ટોરી પર + દબાવો અને પહેલી પોસ્ટ કરો!|કોઈક|હમણાં|{n} મિનિટ|{n} કલાક|{n} દિવસ|{n} લાઇક|પોસ્ટ થઈ નથી.|તમારી ભાષા પસંદ કરો|નીચે 🌐 થી ગમે ત્યારે બદલી શકો.|આગળ વધો|ભાષા શોધો...|અનુવાદ થઈ રહ્યો છે...|અનુવાદ થયો નથી. ફરી પ્રયાસ કરો અથવા બીજી ભાષા પસંદ કરો.",
kn:"ಮೊಬೈಲ್ ಸಂಖ್ಯೆಯಿಂದ ಲಾಗಿನ್ ಮಾಡಿ (ಡೆಮೊ)|10 ಅಂಕಿಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ|OTP ಕಳುಹಿಸಿ|ಸರಿಯಾದ 10 ಅಂಕಿಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ನಮೂದಿಸಿ (6-9 ರಿಂದ ಆರಂಭ).|{p} ಗೆ OTP ಕಳುಹಿಸಲಾಗಿದೆ.|ಡೆಮೊ: ನಿಜವಾದ SMS ಹೋಗುವುದಿಲ್ಲ. ನಿಮ್ಮ OTP {c}|6 ಅಂಕಿಯ OTP|ಪರಿಶೀಲಿಸಿ|ಮತ್ತೆ ಕಳುಹಿಸಿ|ಸಂಖ್ಯೆ ಬದಲಿಸಿ|OTP ತಪ್ಪಾಗಿದೆ. ಇನ್ನೂ {n} ಪ್ರಯತ್ನ ಬಾಕಿ.|3 ಬಾರಿ ತಪ್ಪು. ಹೊಸ OTP ಕೇಳಿ.|ಲಾಗ್ ಔಟ್ ಮಾಡಬೇಕೇ?|ನಿಮ್ಮ ಸ್ಟೋರಿ|ಏನಾದರೂ ಬರೆಯಿರಿ...|ಹಂಚಿಕೊಳ್ಳಿ|ಇನ್ನೂ ಪೋಸ್ಟ್‌ಗಳಿಲ್ಲ. ಮೇಲೆ ನಿಮ್ಮ ಸ್ಟೋರಿಯಲ್ಲಿ + ಒತ್ತಿ ಮೊದಲ ಪೋಸ್ಟ್ ಮಾಡಿ!|ಯಾರೋ|ಈಗ|{n} ನಿಮಿಷ|{n} ಗಂಟೆ|{n} ದಿನ|{n} ಲೈಕ್‌ಗಳು|ಪೋಸ್ಟ್ ಆಗಲಿಲ್ಲ.|ನಿಮ್ಮ ಭಾಷೆ ಆಯ್ಕೆಮಾಡಿ|ಕೆಳಗಿನ 🌐 ಮೂಲಕ ಯಾವಾಗ ಬೇಕಾದರೂ ಬದಲಿಸಬಹುದು.|ಮುಂದುವರಿಸಿ|ಭಾಷೆ ಹುಡುಕಿ...|ಅನುವಾದವಾಗುತ್ತಿದೆ...|ಅನುವಾದ ವಿಫಲವಾಯಿತು. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ ಅಥವಾ ಬೇರೆ ಭಾಷೆ ಆಯ್ಕೆಮಾಡಿ.",
ml:"മൊബൈൽ നമ്പർ ഉപയോഗിച്ച് ലോഗിൻ ചെയ്യുക (ഡെമോ)|10 അക്ക മൊബൈൽ നമ്പർ|OTP അയയ്ക്കുക|ശരിയായ 10 അക്ക മൊബൈൽ നമ്പർ നൽകുക (6-9 ൽ തുടങ്ങുന്നത്).|{p} ലേക്ക് OTP അയച്ചു.|ഡെമോ: യഥാർത്ഥ SMS പോകില്ല. നിങ്ങളുടെ OTP {c}|6 അക്ക OTP|പരിശോധിക്കുക|വീണ്ടും അയയ്ക്കുക|നമ്പർ മാറ്റുക|OTP തെറ്റാണ്. {n} ശ്രമങ്ങൾ ബാക്കി.|3 തവണ തെറ്റി. പുതിയ OTP ചോദിക്കൂ.|ലോഗൗട്ട് ചെയ്യണോ?|നിങ്ങളുടെ സ്റ്റോറി|എന്തെങ്കിലും എഴുതൂ...|പങ്കിടുക|ഇതുവരെ പോസ്റ്റുകളില്ല. മുകളിൽ നിങ്ങളുടെ സ്റ്റോറിയിൽ + അമർത്തി ആദ്യ പോസ്റ്റ് ഇടൂ!|ആരോ|ഇപ്പോൾ|{n} മിനിറ്റ്|{n} മണിക്കൂർ|{n} ദിവസം|{n} ലൈക്കുകൾ|പോസ്റ്റ് ആയില്ല.|നിങ്ങളുടെ ഭാഷ തിരഞ്ഞെടുക്കുക|താഴെ 🌐 വഴി എപ്പോൾ വേണമെങ്കിലും മാറ്റാം.|തുടരുക|ഭാഷ തിരയുക...|വിവർത്തനം ചെയ്യുന്നു...|വിവർത്തനം പരാജയപ്പെട്ടു. വീണ്ടും ശ്രമിക്കുക അല്ലെങ്കിൽ മറ്റൊരു ഭാഷ തിരഞ്ഞെടുക്കുക.",

  let side=900,q=.82;

   const k=Math.min(1,side/Math.max(im.width,im.height)),c=document.createElement("canvas");
   c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
   const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
   const d=c.toDataURL("image/jpeg",q);

  return null}finally{URL.revokeObjectURL(u)}}

async function pwSignIn(){
 const v=$("sip").value.trim(),pw=$("sipw").value,er=$("sie");
 if(!/^[6-9]\d{9}$/.test(v)||!pw){er.textContent=t("siE1");return}
 const prev=phone;phone=v;const p=getProf();phone=prev;
 if(!p){er.textContent=t("siNo");return}
 if(!p.h||!p.s){er.textContent=t("siNp");return}
 $("sib").disabled=true;
 try{
  const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p.s+pw));
  if(hex(new Uint8Array(d))!==p.h){
   sTries++;
   if(sTries>=5){er.textContent=t("siLk");setTimeout(()=>{sTries=0;$("sib").disabled=false},30000);return}
   er.textContent=t("siBad",{n:5-sTries});$("sib").disabled=false;return}
  sTries=0;phone=v;ls.s("phone",v);$("sipw").value="";er.textContent="";$("sib").disabled=false;afterLogin()
 }catch(e){er.textContent=t("siX");$("sib").disabled=false}}

 const was=editing;editing=false;$("pw").value="";enter();if(was){tab="me";render()}};
